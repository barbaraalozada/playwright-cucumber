name: Cucumber Tests

permissions:
  contents: write
  pages: write

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "regression"
        type: choice
        options:
          - smoke
          - regression
      browser:
        description: "Browser to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chromium
          - firefox

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox"]') || fromJSON(format('["{0}"]', github.event.inputs.browser)) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: false
          ALLURE_RESULTS_DIR: allure-results-${{ matrix.browser }}
          BASE_URL: https://demoqa.com
          BOOK_STORE_USERNAME: ${{ secrets.BOOK_STORE_USERNAME }}
          BOOK_STORE_PASSWORD: ${{ secrets.BOOK_STORE_PASSWORD }}
          BOOK_STORE_DELETED_USERNAME: ${{ secrets.BOOK_STORE_DELETED_USERNAME }}
          BOOK_STORE_DELETED_PASSWORD: ${{ secrets.BOOK_STORE_DELETED_PASSWORD }}
        run: xvfb-run --auto-servernum npm run ${{ github.event.inputs.suite }}

      - name: Add Allure executor info
        if: always()
        run: |
          if [ -d "allure-results-${{ matrix.browser }}" ]; then
            echo '{
              "name": "GitHub Actions",
              "type": "github",
              "buildName": "${{ github.workflow }} #${{ github.run_number }}",
              "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "buildOrder": ${{ github.run_number }},
              "reportName": "Allure Report - ${{ matrix.browser }}"
            }' > allure-results-${{ matrix.browser }}/executor.json
          fi

      - name: Add Allure environment info
        if: always()
        run: |
          if [ -d "allure-results-${{ matrix.browser }}" ]; then
            echo "Browser=${{ matrix.browser }}
          Test.Suite=${{ github.event.inputs.suite }}
          Base.URL=https://demoqa.com
          Node.Version=$(node --version)
          OS=ubuntu-latest
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Triggered.By=${{ github.actor }}" > allure-results-${{ matrix.browser }}/environment.properties
          fi

      - name: Add Allure categories
        if: always()
        run: |
          if [ -d "allure-results-${{ matrix.browser }}" ]; then
            echo '[
              {
                "name": "Product Defects",
                "description": "Tests that found actual bugs in the application",
                "descriptionHtml": "<b>Product defects</b> - tests that found bugs",
                "messageRegex": ".*AssertionError.*|.*expect.*|.*Expected.*",
                "matchedStatuses": ["failed"]
              },
              {
                "name": "Test Defects",
                "description": "Tests with implementation issues (locators, timeouts, etc)",
                "descriptionHtml": "<b>Test defects</b> - automation issues",
                "messageRegex": ".*TimeoutError.*|.*locator.*|.*selector.*|.*Element.*not found.*",
                "matchedStatuses": ["broken"]
              },
              {
                "name": "Infrastructure Issues",
                "description": "Environment or infrastructure problems",
                "descriptionHtml": "<b>Infrastructure</b> - env/network issues",
                "messageRegex": ".*ECONNREFUSED.*|.*network.*|.*ERR_.*",
                "matchedStatuses": ["broken"]
              },
              {
                "name": "Skipped Tests",
                "description": "Tests that were skipped",
                "matchedStatuses": ["skipped"]
              }
            ]' > allure-results-${{ matrix.browser }}/categories.json
          fi

      - name: Check if allure-results exists
        id: check-results
        if: always()
        run: |
          if [ -d "allure-results-${{ matrix.browser }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Allure report (${{ matrix.browser }})
        if: always() && steps.check-results.outputs.exists == 'true'
        run: npx allure generate allure-results-${{ matrix.browser }} -o allure-report --clean

      - name: Upload Allure report artifact (${{ matrix.browser }})
        if: always() && steps.check-results.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          retention-days: 7

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Chromium report
        if: github.event.inputs.browser == 'all' || github.event.inputs.browser == 'chromium'
        uses: actions/download-artifact@v4
        with:
          name: allure-report-chromium
          path: reports/chromium
        continue-on-error: true

      - name: Download Firefox report
        if: github.event.inputs.browser == 'all' || github.event.inputs.browser == 'firefox'
        uses: actions/download-artifact@v4
        with:
          name: allure-report-firefox
          path: reports/firefox
        continue-on-error: true

      - name: Check if reports exist
        id: check-reports
        run: |
          if [ -d "reports/chromium" ] || [ -d "reports/firefox" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        if: steps.check-reports.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          keep_files: true
