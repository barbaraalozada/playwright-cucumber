name: Cucumber Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chromium
          - firefox

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium, firefox]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests (${{ matrix.browser }})
        if: github.event.inputs.browser == 'all' || github.event.inputs.browser == matrix.browser
        run: |
          export BROWSER=${{ matrix.browser }}
          export ALLURE_RESULTS_DIR=allure-results-${{ matrix.browser }}
          npm test

      - name: Check if allure-results exists
        id: check-results
        if: always() && (github.event.inputs.browser == 'all' || github.event.inputs.browser == matrix.browser)
        run: |
          if [ -d "allure-results-${{ matrix.browser }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Allure report (${{ matrix.browser }})
        if: always() && steps.check-results.outputs.exists == 'true'
        run: npx allure generate allure-results-${{ matrix.browser }} -o allure-report --clean

      - name: Upload Allure report artifact (${{ matrix.browser }})
        if: always() && steps.check-results.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          retention-days: 7

      - name: Deploy Allure report to GitHub Pages (${{ matrix.browser }})
        if: always() && steps.check-results.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: ${{ matrix.browser }}
